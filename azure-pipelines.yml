# NEW VERSION FROM MS Docs

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: DotNetCoreCLI@2
  inputs:
    azureSubscription: 'dot-NET-app-SN' #your-authorized-service-connection
    command: 'publish'
    publishWebProjects: true

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'dot-NET-app-SN' #your-authorized-service-connection
    appType: 'webApp'
    appName: '<chinta-dotNET-APP>'
    package: '$(System.DefaultWorkingDirectory)/**/*.zip'
    deploymentMethod: 'auto'
